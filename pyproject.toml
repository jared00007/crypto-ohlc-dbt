[project]
name = "crypto-ohlc-dbt"
version = "0.1.0"
description = "Multi-venue crypto OHLC pipeline: narrow Python ingestion into DuckDB, all reshaping in dbt."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dbt-core>=1.9,<1.11",
    "dbt-duckdb>=1.9,<1.11",
    "duckdb>=1.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
